<body>
 <!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pedido</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{
    background:#faf8f5;
    padding:40px;
}


/* Caixa principal */

.form-container{

    max-width:850px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 25px #ddd;

}


/* Títulos */

.title{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
}


.number{

    width:35px;
    height:35px;
    background:#d98c8c;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;

}


h2{

    font-size:22px;
    color:#555;

}


/* Form */

.form-grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;

}


.input-box{

    display:flex;
    flex-direction:column;

}


label{

    font-size:13px;
    color:#777;
    margin-bottom:8px;

}


input, select, textarea{

    padding:15px;
    border:none;
    background:#f5f1ed;
    border-radius:25px;
    outline:none;
    font-size:14px;

}


textarea{

    border-radius:15px;
    height:100px;
    resize:none;

}


.full{

    grid-column:1/3;

}


/* Pagamento */

.payment{

    margin-top:40px;

}


.payment-box{

    border:2px solid #54c7b0;
    padding:20px;
    border-radius:15px;
    display:flex;
    align-items:center;
    gap:15px;

}


.whatsapp{

    width:45px;
    height:45px;
    background:#32c56d;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;

}


button{

    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:30px;
    background:#2bb673;
    color:white;
    font-size:16px;
    cursor:pointer;

}



@media(max-width:700px){

.form-grid{

grid-template-columns:1fr;

}


.full{

grid-column:auto;

}

}


</style>

</head>


<body>


<div class="form-container">


<div class="title">

<div class="number">1</div>

<h2>Detalhes do pedido</h2>

</div>



<div class="form-grid">


<div class="input-box">

<label>NOME COMPLETO *</label>

<input type="text" placeholder="O seu nome">

</div>



<div class="input-box">

<label>WHATSAPP *</label>

<input type="text" placeholder="+244 9XX XXX XXX">

</div>



<div class="input-box">

<label>CIDADE / BAIRRO</label>

<input type="text" placeholder="Luanda, Talatona...">

</div>



<div class="input-box">

<label>PRODUTO</label>

<select>

<option>Iogurte de Copo individual — 1.000 Kz</option>

<option>Iogurte Familiar</option>

</select>

</div>



<div class="input-box">

<label>SABORES PRETENDIDOS</label>

<input type="text" placeholder="Ex: Manga, Banana...">

</div>



<div class="input-box">

<label>QUANTIDADE</label>

<input type="number" placeholder="Ex: 12 unidades">

</div>



<div class="input-box full">

<label>OBSERVAÇÕES</label>

<textarea placeholder="Alguma preferência especial?"></textarea>

</div>


</div>




<div class="payment">


<div class="title">

<div class="number">2</div>

<h2>Método de pagamento</h2>

</div>



<div class="payment-box">


<div class="whatsapp">

☏

</div>


<div>

<strong>WhatsApp</strong>

<p>Pedido e pagamento por mensagem</p>

</div>


</div>


<button>

Enviar pedido pelo WhatsApp

</button>


</div>



</div>



</body>

</html>
</body>
</html>
